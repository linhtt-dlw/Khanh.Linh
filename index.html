<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Khánh ❤️ Linh</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

    <link rel="apple-touch-icon" sizes="192x192" href="./images/icon-192.png">
    <link rel="manifest" href="manifest.json">

</head>

<body>

    <!-- Background Overlay -->
    <div class="overlay"></div>

    <!-- Main Card -->
    <div class="card">

        <!-- Heart -->
        <div class="heart">

            ❤️

        </div>

        <!-- Names -->
        <h1>

            Linh & Khánh

        </h1>

        <!-- Big Counter -->
        <div class="days">

            <span id="dayNumber">

                0

            </span>

            <span class="label">

                DAYS

            </span>

        </div>

        <!-- Since -->
        <div class="since">

            Together Since

            <br>

            <strong>

                June 22, 2026

            </strong>

        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Detailed Time -->
        <div class="details">

            <div class="detailBox">

                <span id="yearCount">

                    0

                </span>

                <small>

                    Years

                </small>

            </div>

            <div class="detailBox">

                <span id="monthCount">

                    0

                </span>

                <small>

                    Months

                </small>

            </div>

            <div class="detailBox">

                <span id="dayCount">

                    0

                </span>

                <small>

                    Days

                </small>

            </div>

        </div>

        <!-- Divider -->
        <div class="divider"></div>

        <!-- Next Milestone -->
        <div class="milestone">

            <h2>

                🍀 Next Milestone

            </h2>

            <p id="nextMilestone">

                50 Days

            </p>

            <p id="daysLeft">

                8 Days Left

            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
